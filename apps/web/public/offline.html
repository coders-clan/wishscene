<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Can't connect — wishscene</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #10131f;
        background: #f7f5f0;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      img {
        border-radius: 18px;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 550;
        letter-spacing: -0.5px;
        margin: 20px 0 8px;
      }
      p {
        color: #71727c;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        min-height: 44px;
        box-sizing: border-box;
        padding: 12px 22px;
        border-radius: 99px;
        background: #6a4bff;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #10131f;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Can't connect right now</h1>
      <p>wishscene needs an internet connection. Check your connection, then try again.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
