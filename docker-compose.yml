# Local dependencies for product mode (issue #2). Development-only credentials.
# Postgres: postgres://wishscene:wishscene-dev-only@localhost:55432/wishscene
# MinIO S3 API: http://localhost:59000 (console http://localhost:59001)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wishscene
      POSTGRES_PASSWORD: wishscene-dev-only
      POSTGRES_DB: wishscene
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wishscene']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  minio:
    # minio/minio is no longer published; Chainguard's build (RELEASE.2026-09-22T19-25-18Z), pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: wishscene
      MINIO_ROOT_PASSWORD: wishscene-dev-only
    ports:
      - '127.0.0.1:59000:9000'
      - '127.0.0.1:59001:9001'
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
