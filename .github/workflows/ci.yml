name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wishscene
          POSTGRES_PASSWORD: wishscene-ci-only
          POSTGRES_DB: wishscene
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishscene"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WISHSCENE_TEST_PG_URL: postgres://wishscene:wishscene-ci-only@localhost:5432/wishscene
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # gitleaks-action needs a paid license for organization repos; run the pinned CLI instead,
      # before install so node_modules is never scanned.
      - name: Secret scan (gitleaks 8.30.1)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --exit-code 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a fresh database and check for drift
        env:
          DATABASE_URL: postgres://wishscene:wishscene-ci-only@localhost:5432/wishscene
        run: |
          pnpm --filter @wishscene/db exec prisma migrate deploy
          pnpm --filter @wishscene/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm audit --audit-level=high
      - run: pnpm check
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: studio-ui-review
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: studio-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
