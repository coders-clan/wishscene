name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wishscene
          POSTGRES_PASSWORD: wishscene-ci-only
          POSTGRES_DB: wishscene
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishscene"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WISHSCENE_TEST_PG_URL: postgres://wishscene:wishscene-ci-only@localhost:5432/wishscene
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-ui-review
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
