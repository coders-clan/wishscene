name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wishscene
          POSTGRES_PASSWORD: wishscene-ci-only
          POSTGRES_DB: wishscene
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishscene"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WISHSCENE_TEST_PG_URL: postgres://wishscene:wishscene-ci-only@localhost:5432/wishscene
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm check
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: studio-ui-review
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: studio-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
